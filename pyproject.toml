[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tmaudit"
version = "0.5.0"
description = "Config-driven TMLR paper audit + LaTeX compile pipeline"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Liu Zewen", email = "aidless@example.com"},
]
keywords = [
    "tmaudit",
    "tmlr",
    "paper-audit",
    "latex",
    "compile",
    "plugins",
    "neurips",
    "iclr",
    "reviewer",
    "audit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = []

[project.optional-dependencies]
dev = [
    # The lint job installed pyflakes by hand because it was never declared
    # here; the mutation-control job installs only the extras and therefore could
    # not run the lint gate it was trying to measure.
    "pyflakes>=3.0",
    "pytest>=7",
    "mypy>=1.0",
    "build>=0.10",
    "twine>=4",
    # Tests exercise code paths that are only reached when these are importable.
    # Without scipy, verify_TEMPLATE.py:1192 falls back to `return 0.5  # fallback:
    # assume adequate power`, so the c8 power checks never fire and four tests in
    # tests/test_c8_statistical_power.py fail; without PyYAML, detector_config reports
    # "PyYAML missing; using defaults" and two tests in tests/test_detector_config.py
    # fail. Both were green on the author's machine only because it happened to have
    # them installed system-wide.
    "scipy>=1.10",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/aidless/tmaudit"
Issues = "https://github.com/aidless/tmaudit/issues"
Source = "https://github.com/aidless/tmaudit"
Changelog = "https://github.com/aidless/tmaudit/blob/main/CHANGELOG.md"
"v0.4.0 release" = "https://github.com/aidless/tmaudit/releases/tag/v0.4.0"

[project.scripts]
tmaudit = "tmaudit.cli:main"

[project.entry-points."tmaudit.plugins"]
# The example plugin (tmaudit_example_plugin) registers its
# own entry-points when installed. We declare no core
# entry-points here: every audit category lives in
# `src/tmaudit/templates/verify_TEMPLATE.py` and is wired
# via the static `check_cN_*` function calls.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: marks tests as run separately with `pytest -m slow`",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["tmaudit*"]

[tool.setuptools.package-data]
tmaudit = [
    "templates/*.py",
    "templates/*.tex",
    "configs/*.py",
]
