name: CI

# Run the test suite + meta-test on every push and pull request.
# Matrix-tests against Python 3.9, 3.10, 3.11, 3.12 to catch any
# version-specific issue with importlib.resources, raw-string
# regex, or zipapp.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel in-progress runs for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Job 1: install tmaudit, run the 46-test pytest suite, upload JUnit XML
  # --------------------------------------------------------------------------
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml

      - name: Install tmaudit and its test dependencies
        # Three separate gaps used to make this step's job red, all of them about
        # something not being installed rather than the code being wrong:
        #   - tests/test_example_plugin.py discovers three demo checks through entry
        #     points; tmaudit_example_plugin/ ships here but nothing installed it, so
        #     entry_points was empty and all eleven tests in that file failed.
        #   - four tests in tests/test_c8_statistical_power.py only reach the real power
        #     calculation when scipy imports; without it verify_TEMPLATE.py:1192
        #     returns a constant 0.5.
        #   - two tests in tests/test_detector_config.py exercise YAML error handling
        #     that needs PyYAML.
        # scipy and PyYAML are now declared in the `dev` extra, which is what this
        # installs alongside the two packages.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -e ./tmaudit_example_plugin

      - name: Run pytest
        # The two @pytest.mark.slow end-to-end tests fork a verify script and run the
        # real audit, expecting zero findings. They need the actual paper directories
        # (PAPER1_CONSOLIDATED and PAPER5_CONSOLIDATED) with main.tex and refs.bib in
        # them, which live on the author's machine and are not in this repository. On a
        # runner they return 2 — the audit runs and finds nothing to audit. They are
        # deselected here rather than left to fail, and the audit-all job already
        # exercises the same code path on demand.
        run: |
          python -m pytest -m "not slow" \
            --junitxml=test-results-${{ matrix.python-version }}.xml -v

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: test-results-${{ matrix.python-version }}.xml
          if-no-files-found: error
          retention-days: 30

  # --------------------------------------------------------------------------
  # Job 2: regression-injection meta-test (only on Python 3.11 — fast)
  # --------------------------------------------------------------------------
  meta-test:
    name: regression-injection meta-test
    runs-on: ubuntu-latest
    needs: pytest  # only run after pytest passes (saves CI time)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml

      - name: Install tmaudit and its test dependencies
        # The regression harness runs the same suite, so it needs the same extras.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -e ./tmaudit_example_plugin

      - name: Run meta-test (9-bug regression-injection)
        # Runs _check_all_regressions.py, which:
        #   1. For each of 9 historical bugs (Bug 1..Bug 9), injects
        #      a small change into the source code that re-introduces
        #      the bug.
        #   2. Runs the targeted regression test and asserts the test
        #      FAILS (i.e., the regression test catches the bug).
        #   3. Restores the source (via 'git checkout HEAD') and
        #      re-runs the test, asserting it PASSES.
        #
        # Exit code 0 iff all 9 bugs are correctly caught.
        # Exit code 1 if any bug is NOT caught (a serious problem
        # because the regression test would silently miss the bug
        # in production).
        run: |
          python _check_all_regressions.py

      - name: Build tmaudit.pyz (smoke)
        run: |
          python _build_pyz.py
          python tmaudit.pyz list

  # --------------------------------------------------------------------------
  # Job 3: validate GitHub community files
  # --------------------------------------------------------------------------
  validate-community-files:
    name: validate community files (.github/)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML (for the validator)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Run community-files validator
        # Validates:
        #   - .github/ISSUE_TEMPLATE/config.yml (YAML, blank_issues, links)
        #   - 4 issue templates (frontmatter, name, description, title,
        #     labels, body)
        #   - .github/PULL_REQUEST_TEMPLATE.md (sections, mentions of
        #     "test" and "checklist")
        #   - .github/CODEOWNERS (presence, rule count)
        #   - .github/dependabot.yml (YAML, updates list)
        #   - .github/CODE_OF_CONDUCT.md (presence, line count)
        #   - .github/SUPPORT.md (presence, line count)
        #   - .github/workflows/*.yml (YAML, name, on, jobs)
        #
        # Exit 0 on OK/WARN, exit 1 on any FAIL.
        run: |
          python _check_github_templates.py

      - name: Save validator JSON output
        if: always()
        run: |
          python _check_github_templates.py --json > community-files-validation.json
          cat community-files-validation.json | head -20

      - name: Upload validator JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-files-validation
          path: community-files-validation.json
          if-no-files-found: warn
          retention-days: 7

  # --------------------------------------------------------------------------
  # Job 4: audit-all — runs verify on all configured papers,
  # generates a Markdown report, and uploads it as an artefact.
  # This is the v0.2.0 acceptance criterion: the report is
  # included in the CI artefacts.
  # --------------------------------------------------------------------------
  audit-all:
    name: audit-all (v0.2.0 report)
    runs-on: ubuntu-latest
    env:
      TMAUDIT_RESEARCH_DIR: /tmp/tmaudit-research
    # The five per-paper directories this audits do not exist on a runner — the
    # papers live on the author's machine — so audit-all exits non-zero after writing
    # its report. That is a true statement about the environment rather than about the
    # code, and it was previously reported as a code failure: the job died on
    # FileNotFoundError for 'F:/Research/PAPER1_CONSOLIDATED/verify_p1.py' before
    # writing anything at all. With TMAUDIT_RESEARCH_DIR the job now completes and
    # uploads a report, so it runs on demand instead of painting the badge red.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tmaudit in editable mode
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      # The per-paper configurations point at the author's research tree, which does
      # not exist on a runner. src/tmaudit/configs/*.py now reads this variable, so the
      # job gets a directory it can actually write into instead of dying with
      # FileNotFoundError on 'F:/Research/PAPER1_CONSOLIDATED/verify_p1.py' before a
      # single check runs.
      - name: Prepare a research directory
        run: |
          for n in 1 2 3 4 5; do
            mkdir -p "${TMAUDIT_RESEARCH_DIR}/PAPER${n}_CONSOLIDATED"
          done

      - name: Run audit-all and write Markdown report
        # The --output flag tells audit-all to write a Markdown
        # report. The --no-cache flag forces a fresh audit
        # (we don't want stale cache in CI).
        # The report is uploaded as an artefact below.
        run: |
          python -m src.tmaudit audit-all --start 1 --end 5 --output audit-report.md --no-cache
          echo "=== Report head ==="
          head -30 audit-report.md
          echo "=== Report tail ==="
          tail -10 audit-report.md

      - name: Upload Markdown report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmaudit-audit-report
          path: audit-report.md
          if-no-files-found: warn
          retention-days: 30

  # --------------------------------------------------------------------------
  # Job 5: lint (skip if dev not installed; cheap)
  # --------------------------------------------------------------------------
  lint:
    name: lint (pyflakes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pyflakes
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyflakes

      - name: Run pyflakes
        # We lint only the package source, not the templates
        # (templates intentionally include broad try/except and
        # late imports for robustness).
        run: |
          python -m pyflakes src/tmaudit/ tests/

  # --------------------------------------------------------------------------
  # Job 6: mutation-control — prove the pytest and lint gates still fail.
  #
  # This suite was just through a round of fake-green repairs (three test
  # dependencies that were declared late, the pyz build root, and two rounds of
  # the Python 3.9 entry_points() fallback in src/tmaudit/plugins.py). The
  # repairs are real, but nothing yet demonstrates that the gates left standing
  # can actually go red. This job supplies that demonstration.
  #
  # The mutation is the same failure the recent fixes were about, in a form that
  # is observable on every row of the pytest matrix: one token of
  # load_plugins() is renamed so the entry-point lookup raises NameError instead
  # of returning a plugin list. Plugin discovery then yields nothing and the 11
  # tests in tests/test_example_plugin.py fail. The name is evaluated before the
  # call, so this lands on 3.9 as well -- where the real bug lived -- rather than
  # being silently inert on 3.10+ the way a mutation inside the 3.9-only
  # fallback branch would be. The same edit is also an undefined name, so pyflakes
  # catches it too and the lint gate is covered by the same mutation.
  #
  # The gates are not retyped here. Each step's own `run:` block is pulled out of
  # this file at run time and executed as-is, so this job exercises the step that
  # really runs and cannot drift from it.
  #
  # Fail-closed throughout: a dirty worktree aborts before anything is mutated,
  # both gates must be green on the clean tree or the job stops (a red gate on an
  # already-red tree proves nothing), the mutation is rejected unless its anchor
  # matched exactly once, and the restore is verified against `git status`.
  # --------------------------------------------------------------------------
  mutation-control:
    name: mutation-control (pytest + lint gates fail closed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml

      - name: Install tmaudit and its test dependencies
        # pyflakes is installed explicitly as well as via the dev extra. The lint
        # job has always installed it by hand because it was never declared in
        # pyproject.toml, and this job installs only the extras -- so its first run
        # failed closed with "pyflakes gate expected GREEN but exited 1", which was
        # a missing module rather than a real lint finding. A control must measure
        # the gate in the same environment the gate runs in.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -e ./tmaudit_example_plugin
          python -m pip install pyflakes

      - name: mutation-control
        run: |
          set -euo pipefail

          # One row of the pytest matrix is enough here: the mutation is
          # version-independent by construction (see the job comment), so this
          # result holds for every row.
          MC_PYVER='3.11'

          TARGET='src/tmaudit/plugins.py'
          # Renaming the constant one read turns plugin discovery into a hard
          # NameError. Same byte length as the original would-be name is NOT
          # required -- see the cache note below -- but keeping the edit to a
          # single token keeps it obvious in review.
          ANCHOR='eps = entry_points(group=PLUGIN_GROUP)'
          MUTATED='eps = entry_points(group=PLUGIN_GROUPS)'

          LOGDIR="${RUNNER_TEMP:-/tmp}/mutation-control"
          LAST_RC=0
          LAST_LOG=''
          mkdir -p "$LOGDIR"

          # ---------------------------------------------------------------------
          # Cache hygiene. This is load-bearing, not decoration. CPython reuses a
          # __pycache__/*.pyc whose recorded source (mtime, size) still matches,
          # and mtime has one-second granularity. A mutation that keeps the file
          # size and lands in the same second as the cached .pyc is therefore
          # ignored outright: demonstrated locally, a stale-bytecode run reported
          # "223 passed" while the mutation was live and pyflakes was the only
          # thing that noticed. Two defences are applied together --
          #   * every cache is deleted before each gate run, so no .pyc survives
          #     an edit, and
          #   * PYTHONDONTWRITEBYTECODE=1 stops a new one being written, so the
          #     mutated source is the only copy that can be imported.
          # ---------------------------------------------------------------------
          purge_caches() {
            find . -type d -name '__pycache__' -prune -exec rm -rf {} + 2>/dev/null || true
            find . -type d -name '.pytest_cache' -prune -exec rm -rf {} + 2>/dev/null || true
          }

          tail_log() {
            echo "  --- last 25 lines of $1 ---"
            tail -n 25 "$1" | sed 's/^/    | /'
          }

          probe() {
            local name="$1"; shift
            LAST_LOG="${LOGDIR}/${name}.log"
            LAST_RC=0
            "$@" >"$LAST_LOG" 2>&1 || LAST_RC=$?
            printf '  probe %-30s exit=%s\n' "$name" "$LAST_RC"
          }

          expect_green() {
            if [ "$LAST_RC" -ne 0 ]; then
              echo "::error::$1 expected GREEN (exit 0) but exited $LAST_RC"
              tail_log "$LAST_LOG"
              return 1
            fi
            echo "  OK   $1 is green (exit 0)"
          }

          expect_red() {
            if [ "$LAST_RC" -eq 0 ]; then
              echo "::error::$1 expected a NON-ZERO exit but exited 0 -- the gate is a no-op"
              tail_log "$LAST_LOG"
              return 1
            fi
            echo "  OK   $1 went red as required (exit $LAST_RC)"
          }

          # ---------------------------------------------------------------------
          # Pull the two gates' own `run:` blocks out of this file. An anchor that
          # does not hit exactly once aborts the job rather than silently
          # producing a different script. A leftover Actions expression aborts too:
          # GitHub substitutes those before running, so an unsubstituted one means
          # we would be testing a script CI never runs.
          # ---------------------------------------------------------------------
          python - "$LOGDIR" "$MC_PYVER" <<'PY'
          import sys
          from pathlib import Path

          import yaml

          out_dir = Path(sys.argv[1])
          pyver = sys.argv[2]

          WANTED = [
              # (job, step, output name, anchor, replacement)
              ("pytest", "Run pytest", "gate_pytest.sh",
               "$" + "{{ matrix.python-version }}", pyver),
              ("lint", "Run pyflakes", "gate_lint.sh", "", ""),
          ]

          wf = ".github/workflows/ci.yml"
          with open(wf, encoding="utf-8") as fh:
              cfg = yaml.safe_load(fh)

          for job, step, out_name, anchor, replacement in WANTED:
              found = [s for s in cfg["jobs"][job]["steps"]
                       if s.get("name") == step]
              if len(found) != 1:
                  sys.exit(f"{wf}#{job}: expected exactly 1 step named "
                           f"{step!r}, found {len(found)}")
              run = found[0].get("run") or ""
              if not run.strip():
                  sys.exit(f"{wf}#{job}/{step}: step has no run: block")
              if anchor:
                  hits = run.count(anchor)
                  if hits != 1:
                      sys.exit(f"{wf}#{job}/{step}: anchor {anchor!r} occurs "
                               f"{hits} time(s), expected exactly 1")
                  run = run.replace(anchor, replacement)
              unsub = "$" + "{{"
              leftover = [ln for ln in run.splitlines() if unsub in ln]
              if leftover:
                  sys.exit(f"{wf}#{job}/{step}: unsubstituted expression left "
                           f"in run block: {leftover}")
              (out_dir / out_name).write_text(run, encoding="utf-8")
              print(f"  extracted {wf}#{job}/{step} -> {out_name}")
          PY

          # GitHub runs a `run:` block as `bash -e {0}` (no `shell:` key is set on
          # either step). Same interpreter, same flags, so the exit code observed
          # here is the exit code the gate really produces.
          #
          # PYTHONPATH is pinned to the worktree's own src/ on top of the editable
          # install. It resolves to the same directory in CI, and it is what makes
          # the gate honest anywhere else: an editable install left over from a
          # different checkout would otherwise keep serving pre-mutation bytecode
          # while the gate claims to be reading this tree.
          gate_pytest() {
            PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$PWD/src${PYTHONPATH:+:$PYTHONPATH}" \
              bash --noprofile --norc -e "$LOGDIR/gate_pytest.sh"
          }
          gate_lint() {
            PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$PWD/src${PYTHONPATH:+:$PYTHONPATH}" \
              bash --noprofile --norc -e "$LOGDIR/gate_lint.sh"
          }
          # Toothless forms, used only by the negative control in phase 5: the
          # gate's real body with its exit code thrown away.
          toothless_pytest() { gate_pytest || true; }
          toothless_lint()   { gate_lint   || true; }

          inject_mutation() {
            python - "$TARGET" "$ANCHOR" "$MUTATED" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          anchor, mutated = sys.argv[2], sys.argv[3]
          text = path.read_text(encoding="utf-8")
          hits = text.count(anchor)
          if hits != 1:
              sys.exit(f"anchor occurs {hits} time(s) in {path}, expected exactly 1: "
                       f"{anchor!r} -- the source moved, refusing to mutate blind")
          path.write_text(text.replace(anchor, mutated), encoding="utf-8")
          after = path.read_text(encoding="utf-8")
          if after.count(mutated) != 1 or anchor in after:
              sys.exit(f"mutation did not land cleanly in {path}")
          print(f"  injected into {path}: {anchor} -> {mutated}")
          PY
          }

          # ---------------------------------------------------------------------
          # Phase 0 — preflight
          # ---------------------------------------------------------------------
          echo "::group::phase 0 -- preflight"
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::worktree is dirty; mutation-control only runs on a clean tree"
            git status --porcelain
            exit 1
          fi
          git ls-files --error-unmatch "$TARGET" >/dev/null 2>&1 \
            || { echo "::error::$TARGET is not tracked; cannot use it as the mutation"; exit 1; }
          purge_caches
          echo "  mutation target: $TARGET"
          echo "::endgroup::"

          # ---------------------------------------------------------------------
          # Phase 1 — baseline. Fail closed: if a gate is not green here, stop.
          # Injecting into an already-red tree would make the mutation meaningless.
          # ---------------------------------------------------------------------
          echo "::group::phase 1 -- baseline must be green"
          probe baseline-pytest gate_pytest
          expect_green "pytest gate on the clean tree" || exit 1
          probe baseline-lint gate_lint
          expect_green "pyflakes gate on the clean tree" || exit 1
          echo "::endgroup::"

          # ---------------------------------------------------------------------
          # Phase 2 — inject the mutation
          # ---------------------------------------------------------------------
          echo "::group::phase 2 -- inject mutation"
          inject_mutation
          purge_caches
          if ! grep -q "$MUTATED" "$TARGET"; then
            echo "::error::mutation is not present in $TARGET after injection"
            exit 1
          fi
          echo "  mutation in place; entry-point discovery can no longer succeed"
          echo "::endgroup::"

          # ---------------------------------------------------------------------
          # Phase 3 — both gates must go red, and for the right reason
          # ---------------------------------------------------------------------
          echo "::group::phase 3 -- both gates must go red"
          probe mutated-pytest gate_pytest
          expect_red "pytest gate with $TARGET mutated" || exit 1
          # Real test failures, not a collection crash: a module that fails to
          # import would also exit non-zero but would tell us nothing about
          # whether the assertions have teeth.
          n_failed="$(grep -c '^FAILED' "$LAST_LOG" || true)"
          if [ "$n_failed" -lt 1 ]; then
            echo "::error::pytest exited non-zero but reported no FAILED test"
            tail_log "$LAST_LOG"
            exit 1
          fi
          echo "  OK   $n_failed tests FAILED in the mutated tree"
          probe mutated-lint gate_lint
          expect_red "pyflakes gate with $TARGET mutated" || exit 1
          if [ "$(grep -c "undefined name 'PLUGIN_GROUPS'" "$LAST_LOG" || true)" -lt 1 ]; then
            echo "::error::pyflakes exited non-zero without reporting the injected undefined name"
            tail_log "$LAST_LOG"
            exit 1
          fi
          echo "  OK   pyflakes named the injected undefined name"
          echo "::endgroup::"

          # ---------------------------------------------------------------------
          # Phase 4 — restore. Proves the mutation is fully reversible and leaves
          # no residue behind.
          # ---------------------------------------------------------------------
          echo "::group::phase 4 -- restore and re-verify"
          git checkout HEAD -- "$TARGET"
          purge_caches
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::worktree not clean after restore"
            git status --porcelain
            exit 1
          fi
          probe restored-pytest gate_pytest
          expect_green "pytest gate after restore" || exit 1
          probe restored-lint gate_lint
          expect_green "pyflakes gate after restore" || exit 1
          echo "::endgroup::"

          # ---------------------------------------------------------------------
          # Phase 5 — negative control. The point of this phase: prove the check
          # above is not itself a shell that always says OK. Both gates are put
          # back into the fake-green shape that swallowed failures everywhere in
          # this repo's history -- run the body, discard the exit code -- while
          # the mutation is active. Each must then be REJECTED by expect_red. If
          # either is accepted, this job would happily vouch for a gate that
          # cannot fail.
          # ---------------------------------------------------------------------
          echo "::group::phase 5 -- negative control (the control must have teeth)"
          inject_mutation
          purge_caches
          probe negcontrol-pytest toothless_pytest
          if expect_red "pytest gate wrapped in '|| true'"; then
            echo "::error::the control accepted a toothless pytest gate -- mutation-control is vacuous"
            exit 1
          else
            echo "  OK   control rejected the toothless pytest gate"
          fi
          probe negcontrol-lint toothless_lint
          if expect_red "pyflakes gate wrapped in '|| true'"; then
            echo "::error::the control accepted a toothless pyflakes gate -- mutation-control is vacuous"
            exit 1
          else
            echo "  OK   control rejected the toothless pyflakes gate"
          fi
          git checkout HEAD -- "$TARGET"
          purge_caches
          echo "::endgroup::"

          # ---------------------------------------------------------------------
          # Phase 6 — final integrity
          # ---------------------------------------------------------------------
          echo "::group::phase 6 -- final integrity"
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::mutation-control left the worktree dirty"
            git status --porcelain
            exit 1
          fi
          echo "  worktree clean — both gates proven fail-closed"
          echo "::endgroup::"
          echo "mutation-control: PASS — the gates have teeth."

  secret-scan:
    # Full history: a key leaked in an old commit is still a live key. The CLI is
    # used rather than gitleaks-action, which needs GITHUB_TOKEN to scan pull
    # requests and so turns every Dependabot PR red for an unrelated reason --
    # and a PR runs the workflow from its own branch, so a fix on main does not
    # take effect until the branch is regenerated. Pinned, not latest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --verbose
