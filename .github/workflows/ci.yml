name: CI

# Run the test suite + meta-test on every push and pull request.
# Matrix-tests against Python 3.9, 3.10, 3.11, 3.12 to catch any
# version-specific issue with importlib.resources, raw-string
# regex, or zipapp.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel in-progress runs for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Job 1: install tmaudit, run the 46-test pytest suite, upload JUnit XML
  # --------------------------------------------------------------------------
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml

      - name: Install tmaudit in editable mode
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run pytest
        run: |
          python -m pytest --junitxml=test-results-${{ matrix.python-version }}.xml -v

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: test-results-${{ matrix.python-version }}.xml
          if-no-files-found: error
          retention-days: 30

  # --------------------------------------------------------------------------
  # Job 2: regression-injection meta-test (only on Python 3.11 — fast)
  # --------------------------------------------------------------------------
  meta-test:
    name: regression-injection meta-test
    runs-on: ubuntu-latest
    needs: pytest  # only run after pytest passes (saves CI time)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml

      - name: Install tmaudit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run meta-test (6-bug regression-injection)
        run: |
          python _check_all_regressions.py

      - name: Build tmaudit.pyz (smoke)
        run: |
          python _build_pyz.py
          python tmaudit.pyz list

  # --------------------------------------------------------------------------
  # Job 3: lint (skip if dev not installed; cheap)
  # --------------------------------------------------------------------------
  lint:
    name: lint (pyflakes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pyflakes
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyflakes

      - name: Run pyflakes
        # We lint only the package source, not the templates
        # (templates intentionally include broad try/except and
        # late imports for robustness).
        run: |
          python -m pyflakes src/tmaudit/ tests/
