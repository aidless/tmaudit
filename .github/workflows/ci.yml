name: CI

# Run the test suite + meta-test on every push and pull request.
# Matrix-tests against Python 3.9, 3.10, 3.11, 3.12 to catch any
# version-specific issue with importlib.resources, raw-string
# regex, or zipapp.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel in-progress runs for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Job 1: install tmaudit, run the 46-test pytest suite, upload JUnit XML
  # --------------------------------------------------------------------------
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml

      - name: Install tmaudit in editable mode
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run pytest
        run: |
          python -m pytest --junitxml=test-results-${{ matrix.python-version }}.xml -v

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: test-results-${{ matrix.python-version }}.xml
          if-no-files-found: error
          retention-days: 30

  # --------------------------------------------------------------------------
  # Job 2: regression-injection meta-test (only on Python 3.11 — fast)
  # --------------------------------------------------------------------------
  meta-test:
    name: regression-injection meta-test
    runs-on: ubuntu-latest
    needs: pytest  # only run after pytest passes (saves CI time)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml

      - name: Install tmaudit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run meta-test (9-bug regression-injection)
        # Runs _check_all_regressions.py, which:
        #   1. For each of 9 historical bugs (Bug 1..Bug 9), injects
        #      a small change into the source code that re-introduces
        #      the bug.
        #   2. Runs the targeted regression test and asserts the test
        #      FAILS (i.e., the regression test catches the bug).
        #   3. Restores the source (via 'git checkout HEAD') and
        #      re-runs the test, asserting it PASSES.
        #
        # Exit code 0 iff all 9 bugs are correctly caught.
        # Exit code 1 if any bug is NOT caught (a serious problem
        # because the regression test would silently miss the bug
        # in production).
        run: |
          python _check_all_regressions.py

      - name: Build tmaudit.pyz (smoke)
        run: |
          python _build_pyz.py
          python tmaudit.pyz list

  # --------------------------------------------------------------------------
  # Job 3: validate GitHub community files
  # --------------------------------------------------------------------------
  validate-community-files:
    name: validate community files (.github/)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML (for the validator)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Run community-files validator
        # Validates:
        #   - .github/ISSUE_TEMPLATE/config.yml (YAML, blank_issues, links)
        #   - 4 issue templates (frontmatter, name, description, title,
        #     labels, body)
        #   - .github/PULL_REQUEST_TEMPLATE.md (sections, mentions of
        #     "test" and "checklist")
        #   - .github/CODEOWNERS (presence, rule count)
        #   - .github/dependabot.yml (YAML, updates list)
        #   - .github/CODE_OF_CONDUCT.md (presence, line count)
        #   - .github/SUPPORT.md (presence, line count)
        #   - .github/workflows/*.yml (YAML, name, on, jobs)
        #
        # Exit 0 on OK/WARN, exit 1 on any FAIL.
        run: |
          python _check_github_templates.py

      - name: Save validator JSON output
        if: always()
        run: |
          python _check_github_templates.py --json > community-files-validation.json
          cat community-files-validation.json | head -20

      - name: Upload validator JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-files-validation
          path: community-files-validation.json
          if-no-files-found: warn
          retention-days: 7

  # --------------------------------------------------------------------------
  # Job 4: audit-all — runs verify on all configured papers,
  # generates a Markdown report, and uploads it as an artefact.
  # This is the v0.2.0 acceptance criterion: the report is
  # included in the CI artefacts.
  # --------------------------------------------------------------------------
  audit-all:
    name: audit-all (v0.2.0 report)
    runs-on: ubuntu-latest
    env:
      TMAUDIT_RESEARCH_DIR: /tmp/tmaudit-research
    # The five per-paper directories this audits do not exist on a runner — the
    # papers live on the author's machine — so audit-all exits non-zero after writing
    # its report. That is a true statement about the environment rather than about the
    # code, and it was previously reported as a code failure: the job died on
    # FileNotFoundError for 'F:/Research/PAPER1_CONSOLIDATED/verify_p1.py' before
    # writing anything at all. With TMAUDIT_RESEARCH_DIR the job now completes and
    # uploads a report, so it runs on demand instead of painting the badge red.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tmaudit in editable mode
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      # The per-paper configurations point at the author's research tree, which does
      # not exist on a runner. src/tmaudit/configs/*.py now reads this variable, so the
      # job gets a directory it can actually write into instead of dying with
      # FileNotFoundError on 'F:/Research/PAPER1_CONSOLIDATED/verify_p1.py' before a
      # single check runs.
      - name: Prepare a research directory
        run: |
          for n in 1 2 3 4 5; do
            mkdir -p "${TMAUDIT_RESEARCH_DIR}/PAPER${n}_CONSOLIDATED"
          done

      - name: Run audit-all and write Markdown report
        # The --output flag tells audit-all to write a Markdown
        # report. The --no-cache flag forces a fresh audit
        # (we don't want stale cache in CI).
        # The report is uploaded as an artefact below.
        run: |
          python -m src.tmaudit audit-all --start 1 --end 5 --output audit-report.md --no-cache
          echo "=== Report head ==="
          head -30 audit-report.md
          echo "=== Report tail ==="
          tail -10 audit-report.md

      - name: Upload Markdown report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmaudit-audit-report
          path: audit-report.md
          if-no-files-found: warn
          retention-days: 30

  # --------------------------------------------------------------------------
  # Job 5: lint (skip if dev not installed; cheap)
  # --------------------------------------------------------------------------
  lint:
    name: lint (pyflakes)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pyflakes
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyflakes

      - name: Run pyflakes
        # We lint only the package source, not the templates
        # (templates intentionally include broad try/except and
        # late imports for robustness).
        run: |
          python -m pyflakes src/tmaudit/ tests/
