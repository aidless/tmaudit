# Publish to PyPI (added in v0.4.1)
#
# This workflow uses **trusted publishing** (OIDC) — no API
# tokens are stored in repository secrets. To set up:
#
#   1. Visit https://pypi.org/manage/account/publishing/
#   2. Add a pending publisher:
#        Owner:        aidless
#        Project:      tmaudit
#        Workflow:     publish-pypi.yml
#        Environment:  pypi
#   3. After the first successful run, the publisher becomes
#      "active" automatically.
#
# Triggers:
#   - On GitHub release (types: published) — primary path.
#   - On manual `workflow_dispatch` — for testing.
#
# For each release, the workflow:
#   1. Builds an sdist and a wheel via `python -m build`.
#   2. Publishes both to PyPI via pypa/gh-action-pypi-publish.
#
# Reference: https://docs.pypi.org/trusted-publishers/

name: Publish Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
jobs:
  pypi-publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # OIDC token for trusted publishing.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build

        if: ${{ github.event_name == 'release' && hashFiles('pyproject.toml', 'setup.py', 'setup.cfg') != '' }}
      - name: Build sdist and wheel
        run: python -m build

      - name: Inspect the built distributions
        # A safety check: confirm both `tar.gz` and `.whl`
        # are present. If a future change accidentally
        # produced only one, this job fails before the
        # upload step.
        run: |
          ls -la dist/
          test -f dist/*.tar.gz
          test -f dist/*.whl

        if: ${{ github.event_name == 'release' && hashFiles('pyproject.toml', 'setup.py', 'setup.cfg') != '' }}
      - name: Publish to PyPI
        # No `password:` field — uses OIDC trusted
        # publishing. The `repository_url` defaults to
        # https://upload.pypi.org/legacy/ which is the
        # production PyPI.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086/v1
        # No `with:` block. It previously held a bare `pass` under a comment, which
        # is a scalar where the schema expects a mapping -- the workflow failed to
        # parse, which is why all 18 runs of this file ended in failure regardless
        # of the publishing setup. `print-link-to-check` defaults to false; set it
        # here if you ever need the verbose link output.
