# config.yml — controls the issue chooser that GitHub shows
# when a user clicks "New issue" in the repository.
#
# Reference: https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/configuring-issue-templates-for-your-repository
#
# Field semantics:
#   - blank_issues_enabled: true = users can also open a blank
#     issue (no template). We DISABLE this because every issue
#     should at least be a bug, a feature, an enhancement, or
#     a documentation change.
#   - contact_links: external links shown at the bottom of the
#     chooser (e.g., Discussions, security advisory).
#   - The four template files (bug_report.md, feature_request.md,
#     enhancement.md, docs.md) are auto-discovered by GitHub
#     from the ISSUE_TEMPLATE/ directory and listed in the
#     chooser in alphabetical order. We do not explicitly list
#     them here.
#
# Issue-type guidance:
#   - **Bug report**: for crashes, false positives/negatives,
#     broken CI / pre-commit hook.
#   - **Feature request**: for a NEW audit category (C7+),
#     NEW CLI subcommand, NEW paper config.
#   - **Enhancement**: for improving an EXISTING check,
#     making the CLI more ergonomic, performance improvements.
#     Use this for the C7 threshold, the cache, the error
#     messages, etc.
#   - **Documentation**: for changes to docs ONLY (README,
#     CONTRIBUTING, CHANGELOG, .github templates, etc.).
#     No code change. This template is the easiest to fill
#     and the easiest to merge.

blank_issues_enabled: false

contact_links:
  - name: Q&A / How-to
    url: https://github.com/liumingrui/tmaudit/discussions
    about: For questions about how to use tmaudit, please use GitHub Discussions instead of filing an issue.
  - name: Security vulnerability
    url: https://github.com/liumingrui/tmaudit/security/advisories/new
    about: For security vulnerabilities, please file a private advisory (do NOT file a public issue). See SECURITY.md for the full disclosure policy.